        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a run
      tags:
      - runs
  /runs/{runId}/task-instances:
    get:
      parameters:
      - description: Run ID
        in: path
