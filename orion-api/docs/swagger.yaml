basePath: /
definitions:
  handlers.TriggerRunResponse:
    properties:
      enqueued:
        items:
          type: string
        type: array
      run:
        $ref: '#/definitions/models.Run'
      task_instances:
        items:
          $ref: '#/definitions/models.TaskInstance'
        type: array
    type: object
  models.CreateDAGRequest:
    properties:
      description:
        type: string
      name:
        type: string
      owner:
        type: string
      python_version:
        type: string
      schedule:
        type: string
    type: object
  models.CreateTaskDependencyRequest:
    properties:
      depends_on_task_id:
        type: string
      task_id:
        type: string
    type: object
  models.CreateTaskRequest:
    properties:
      config:
        type: object
      name:
        type: string
      task_type:
        type: string
    type: object
  models.DAG:
    properties:
      created_at:
        type: string
      description:
        description: pointer because it's nullable in the DB
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      owner:
        type: string
      python_version:
        description: e.g. "3.11"; NULL = the worker's own interpreter
        type: string
      schedule:
        type: string
      updated_at:
        type: string
    type: object
  models.DAGSummary:
    properties:
      avg_duration_seconds:
        description: over the same runs
        type: number
      created_at:
        type: string
      description:
        description: pointer because it's nullable in the DB
        type: string
      id:
        type: string
      is_active:
        type: boolean
      last_run:
        $ref: '#/definitions/models.RunBrief'
      name:
        type: string
      owner:
        type: string
      python_version:
        description: e.g. "3.11"; NULL = the worker's own interpreter
        type: string
      recent_durations:
        description: seconds, oldest to newest, for the sparkline
        items:
          type: number
        type: array
      schedule:
        type: string
      success_rate:
        description: 0..1 over the last 20 finished runs
        type: number
      updated_at:
        type: string
    type: object
  models.Run:
    properties:
      created_at:
        type: string
      dag_id:
        type: string
      dag_name:
        type: string
      finished_at:
        type: string
      id:
        type: string
      number:
        description: 'per-DAG sequence: the "#12" in the UI'
        type: integer
      started_at:
        type: string
      status:
        type: string
      tasks_done:
        description: success + failed + skipped
        type: integer
      tasks_total:
        type: integer
      triggered_by:
        type: string
    type: object
  models.RunBrief:
    properties:
      finished_at:
        type: string
      id:
        type: string
      number:
        type: integer
      started_at:
        type: string
      status:
        type: string
    type: object
  models.Stats:
    properties:
      active_runs:
        description: queued or running
        type: integer
      failed_24h:
        type: integer
      success_rate_24h:
        description: 0..1; null when nothing finished in 24h
        type: number
      throughput_24h:
        description: runs finished per hour, oldest first, 24 entries
        items:
          type: integer
        type: array
    type: object
  models.Task:
    properties:
      config:
        type: object
      created_at:
        type: string
      dag_id:
        type: string
      id:
        type: string
      name:
        type: string
      task_type:
        type: string
    type: object
  models.TaskDependency:
    properties:
      depends_on_task_id:
        type: string
      task_id:
        type: string
    type: object
  models.TaskInstance:
    properties:
      attempt:
        type: integer
      finished_at:
        type: string
      id:
        type: string
      logs:
        type: string
      output:
        type: object
      run_id:
        type: string
      started_at:
        type: string
      status:
        type: string
      task_id:
        type: string
      task_name:
        type: string
      worker_id:
        type: string
    type: object
  models.UpdateDAGRequest:
    properties:
      description:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      owner:
        type: string
      python_version:
        type: string
      schedule:
        type: string
    type: object
  models.Worker:
    properties:
      current_run_id:
        description: for linking to the run
        type: string
      current_task:
        description: '"dag / task" while busy'
        type: string
      host:
        type: string
      id:
        description: hostname-pid
        type: string
      pid:
        type: integer
      started_at:
        type: string
      status:
        description: '"idle" or "busy"'
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API for the Orion DAG orchestration platform
  title: Orion API
  version: "1.0"
paths:
  /dags:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.DAGSummary'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List all DAGs
      tags:
      - dags
    post:
      consumes:
      - application/json
      parameters:
      - description: DAG to create
        in: body
        name: dag
        required: true
        schema:
          $ref: '#/definitions/models.CreateDAGRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.DAG'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a DAG
      tags:
      - dags
  /dags/{dagId}/dependencies:
    get:
      parameters:
      - description: DAG ID
        in: path
        name: dagId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.TaskDependency'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List dependencies for a DAG
      tags:
      - dependencies
    post:
      consumes:
      - application/json
      description: task_id will only run after depends_on_task_id succeeds. Both tasks
        must belong to the DAG; self-dependencies, duplicates and cycles are rejected.
      parameters:
      - description: DAG ID
        in: path
        name: dagId
        required: true
        type: string
      - description: Edge to add
        in: body
        name: dependency
        required: true
        schema:
          $ref: '#/definitions/models.CreateTaskDependencyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.TaskDependency'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Make one task depend on another
      tags:
      - dependencies
  /dags/{dagId}/dependencies/{taskId}/{dependsOnId}:
    delete:
      parameters:
      - description: DAG ID
        in: path
        name: dagId
        required: true
        type: string
      - description: Task that depends on the other
        in: path
        name: taskId
        required: true
        type: string
      - description: Task it depends on
        in: path
        name: dependsOnId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Remove a dependency
      tags:
      - dependencies
  /dags/{dagId}/runs:
    get:
      parameters:
      - description: DAG ID
        in: path
        name: dagId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Run'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List runs for a DAG
      tags:
      - runs
    post:
      description: Creates the run and one task instance per task, then enqueues the
        tasks that have no dependencies. If Redis is down after the run is created,
        the roots stay queued and a worker's sweeper re-enqueues them.
      parameters:
      - description: DAG ID
        in: path
        name: dagId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.TriggerRunResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Trigger a DAG run
      tags:
      - runs
  /dags/{dagId}/tasks:
    get:
      parameters:
      - description: DAG ID
        in: path
        name: dagId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Task'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List tasks for a DAG
      tags:
      - tasks
    post:
      consumes:
      - application/json
      parameters:
      - description: DAG ID
        in: path
        name: dagId
        required: true
        type: string
      - description: Task to create
        in: body
        name: task
        required: true
        schema:
          $ref: '#/definitions/models.CreateTaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Task'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a task under a DAG
      tags:
      - tasks
  /dags/{id}:
    delete:
      parameters:
      - description: DAG ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete a DAG
      tags:
      - dags
    get:
      parameters:
      - description: DAG ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.DAGSummary'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a DAG
      tags:
      - dags
    put:
      consumes:
      - application/json
      parameters:
      - description: DAG ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: dag
        required: true
        schema:
          $ref: '#/definitions/models.UpdateDAGRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.DAG'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update a DAG
      tags:
      - dags
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - health
  /runs:
    get:
      parameters:
      - description: Max rows (default 50, max 200)
        in: query
        name: limit
        type: integer
      - description: Only runs with this status
        in: query
        name: status
        type: string
      - description: Only runs of this DAG
        in: query
        name: dag_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Run'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List runs across all DAGs, newest first
      tags:
      - runs
  /runs/{id}:
    get:
      parameters:
      - description: Run ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Run'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a run
      tags:
      - runs
  /runs/{runId}/task-instances:
    get:
      parameters:
      - description: Run ID
        in: path
        name: runId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.TaskInstance'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List task instances
      tags:
      - task-instances
  /stats:
    get:
      description: Active runs, 24h success rate and failures, and runs finished per
        hour for the last 24 hours (oldest first).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Stats'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Dashboard numbers
      tags:
      - stats
  /task-instances/{id}:
    get:
      parameters:
      - description: Task instance ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.TaskInstance'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a task instance
      tags:
      - task-instances
  /tasks/{id}:
    delete:
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete a task
      tags:
      - tasks
    get:
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Task'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a task
      tags:
      - tasks
    put:
      consumes:
      - application/json
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      - description: New task values
        in: body
        name: task
        required: true
        schema:
          $ref: '#/definitions/models.CreateTaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Task'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update a task
      tags:
      - tasks
  /workers:
    get:
      description: Read from worker heartbeats in Redis; a worker that stops heartbeating
        (about 15 seconds) drops out of the list.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Worker'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List live workers
      tags:
      - workers
  /ws:
    get:
      description: Upgrades to a WebSocket and pushes small JSON hints such as {"type":"run","run_id":"...","dag_id":"..."}
        whenever a run or worker changes. Re-fetch the affected resource over REST.
      responses:
        "101":
          description: Switching Protocols
      summary: Live events (WebSocket)
      tags:
      - events
swagger: "2.0"
